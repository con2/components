name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json

      - name: Install library dependencies
        run: npm ci

      - name: Typecheck library
        run: npx tsc --noEmit

      - name: Lint library
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test library
        run: npm test

      - name: Install demo dependencies
        run: npm ci
        working-directory: demo

      - name: Typecheck demo
        run: npx tsc --noEmit
        working-directory: demo

      - name: Lint demo
        run: npm run lint
        working-directory: demo

      - name: Build demo (verifies the demo stays in sync with the library)
        run: npm run build
        working-directory: demo

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: wagoid/commitlint-github-action@v6

  release:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  deploy-demo:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json

      - name: Install library dependencies
        run: npm ci

      - name: Install demo dependencies
        run: npm ci
        working-directory: demo

      - name: Build demo (static export)
        run: npm run build
        working-directory: demo
        env:
          NEXT_BASE_PATH: /components

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
